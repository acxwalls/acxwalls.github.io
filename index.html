<script>
const grid = document.getElementById('grid');
const tags = document.querySelectorAll('.tag');
const body = document.body;
const searchBox = document.getElementById('searchBox');
const searchInput = document.getElementById('searchInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let wallpapers = [];
let filteredWallpapers = [];
let currentPage = 1;
const perPage = 8;

// Fetch wallpapers from data.json
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    wallpapers = data.reverse(); // Latest first
    filteredWallpapers = wallpapers;
    renderWallpapers();
    updateButtons();
  });

function renderWallpapers(){
  grid.innerHTML = '';
  const start = (currentPage - 1) * perPage;
  const end = start + perPage;
  const items = filteredWallpapers.slice(start, end);

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <a href="${item.link}" target="_blank" style="text-decoration:none;color:inherit;">
        <img src="${item.image}" alt="${item.title}">
        <p>
          ${item.title}<br>
          Creator: ${item.creator}
        </p>
      </a>
    `;

    card.onclick = (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
    };

    grid.appendChild(card);
  });
}

function updateButtons(){
  const maxPage = Math.ceil(filteredWallpapers.length / perPage);

  prevBtn.textContent = currentPage>1 ? `PREVIOUS ${currentPage-1}` : 'PREVIOUS';
  nextBtn.textContent = currentPage<maxPage ? `NEXT ${currentPage}` : 'SEARCH TAGS';
}

function animateGrid(){
  grid.classList.add('animate');
  setTimeout(()=>grid.classList.remove('animate'),350);
}

function scrollToTop(){
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pulse(btn){
  btn.classList.add('pulse');
  setTimeout(()=>btn.classList.remove('pulse'),180);
}

nextBtn.onclick=()=>{
  const maxPage = Math.ceil(filteredWallpapers.length / perPage);

  if(currentPage < maxPage){
    currentPage++;
    animateGrid();
    pulse(nextBtn);
    scrollToTop();
    renderWallpapers();
    updateButtons();
  }else{
    searchBox.scrollIntoView({behavior:'smooth'});
    searchInput.focus();
  }
};

prevBtn.onclick=()=>{
  if(currentPage > 1){
    currentPage--;
    animateGrid();
    pulse(prevBtn);
    scrollToTop();
    renderWallpapers();
    updateButtons();
  }
};

// Tag click
tags.forEach(tag=>{
  tag.onclick = e=>{
    e.stopPropagation();
    tags.forEach(t=>t.classList.remove('active'));
    tag.classList.add('active');

    const value = tag.textContent.toLowerCase();

    filteredWallpapers = wallpapers.filter(w =>
      w.tags.map(t=>t.toLowerCase()).includes(value)
    );

    currentPage = 1;
    renderWallpapers();
    updateButtons();
  };
});

// Body click remove active
body.onclick = ()=>{
  tags.forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
};

// Search
searchInput.addEventListener('input',()=>{
  const term = searchInput.value.toLowerCase();

  filteredWallpapers = wallpapers.filter(w =>
    w.title.toLowerCase().includes(term) ||
    w.tags.join(' ').toLowerCase().includes(term)
  );

  currentPage = 1;
  renderWallpapers();
  updateButtons();
});
</script>
