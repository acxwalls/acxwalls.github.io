<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACX Walls</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050914;
  --panel:#0b1124;
  --border:#1b2442;
  --neon:#4ddcff;
  --pink:#ff2f6d;
  --text:#e9ecf3;
  --muted:#8c96ad;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:radial-gradient(circle at top,#0b1228,#050914 70%);
  color:var(--text);
  font-family:system-ui,sans-serif;
  overflow-x:hidden;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:introFade 1.8s ease forwards;
}
#intro h1{
  font-family:'Orbitron',sans-serif;
  font-size:48px;
  color:var(--pink);
  letter-spacing:4px;
}
@keyframes introFade{
  0%,80%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}

/* HEADER */
header{
  padding:32px 26px;
  display:flex;
  justify-content:center;
}
.logo{
  font-family:'Orbitron',sans-serif;
  color:var(--pink);
  font-size:40px;
  letter-spacing:3px;
}

/* SEARCH */
.search{
  margin:20px auto 25px;
  max-width:1200px;
  padding:0 26px;
}
.search input{
  width:100%;
  padding:16px 20px;
  border-radius:40px;
  border:1px solid var(--border);
  background:#0b1124;
  color:white;
  box-shadow:0 0 10px rgba(255,255,255,.15);
  transition:0.3s;
}
.search input:focus{
  outline:none;
  box-shadow:0 0 20px rgba(77,220,255,.4);
}

/* TAGS */
.tags{
  display:flex;
  justify-content:center;
  gap:12px;
  padding:0 26px;
  flex-wrap:wrap;
}
.tag{
  padding:9px 18px;
  font-size:13px;
  border-radius:30px;
  background:#0b1124;
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  transition:0.3s;
}
.tag:hover{color:white; border-color:var(--neon);}
.tag.active{
  color:white;
  border-color:var(--neon);
  box-shadow:0 0 14px rgba(77,220,255,.6);
}

/* TITLE */
.title{
  font-family:'Orbitron',sans-serif;
  font-size:24px;
  max-width:1400px;
  margin:30px auto 14px;
  padding:0 26px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
  padding:0 26px;
  max-width:1400px;
  margin:auto;
  transition:opacity .35s ease, transform .35s ease;
}
.grid.animate{
  opacity:0;
  transform:translateY(12px);
}

@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}

/* CARD */
.card{
  background:linear-gradient(180deg,#0b1124,#070c1c);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:0.35s;
  width:100%;
}
.card:hover{
  transform:scale(1.03);
  box-shadow:0 0 18px rgba(77,220,255,.5);
}
.card.active{
  border-color:var(--neon);
  box-shadow:0 0 20px rgba(77,220,255,.7);
}
.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}
.card p{
  padding:10px 12px;
  font-size:13px;
  color:#cfd6ff;
}

/* PAGINATION */
.pagination{
  display:flex;
  justify-content:space-between;
  padding:40px 26px;
  max-width:1400px;
  margin:auto;
}
.pagination button{
  background:#0b1124;
  border:1px solid var(--border);
  color:white;
  padding:12px 26px;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
}
.pagination button:hover{
  box-shadow:0 0 18px rgba(77,220,255,.5);
}
.pagination button.pulse{
  box-shadow:0 0 22px rgba(77,220,255,.7);
}

/* INFO SECTIONS */
.section{
  max-width:900px;
  margin:auto;
  padding:70px 26px;
}
.section h2{
  font-family:'Orbitron',sans-serif;
  font-size:28px;
  margin-bottom:18px;
}
.section p{
  color:var(--muted);
  line-height:1.8;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  font-size:13px;
  color:#6f7894;
}
footer a{
  color:var(--neon);
  text-decoration:none;
  margin:0 8px;
  transition:0.3s;
}
footer a:hover{color:var(--pink);}
</style>
</head>

<body>

<div id="intro"><h1>ACX WALLS</h1></div>
<header><div class="logo">ACX Walls</div></header>

<section id="home">

<div class="search" id="searchBox">
  <input id="searchInput" type="text" placeholder="Search wallpapers...">
</div>

<div class="tags">
  <div class="tag">Anime</div>
  <div class="tag">Games</div>
  <div class="tag">Mobile</div>
  <div class="tag">Live</div>
  <div class="tag">PC</div>
</div>

<div class="title">Latest Uploads</div>

<div class="grid" id="grid"></div>

<div class="pagination">
  <button id="prevBtn">PREVIOUS</button>
  <button id="nextBtn">NEXT</button>
</div>

</section>

<footer>
© 2026 ACX Walls
</footer>

<script>
document.addEventListener("DOMContentLoaded", function(){

const grid = document.getElementById('grid');
const tags = document.querySelectorAll('.tag');
const searchInput = document.getElementById('searchInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let wallpapers = [];
let filtered = [];
let currentPage = 1;
const perPage = 8;

fetch('data.json')
.then(res=>res.json())
.then(data=>{
  wallpapers = data.reverse();
  filtered = wallpapers;
  render();
  updateButtons();
});

function render(){
  grid.innerHTML='';
  const start=(currentPage-1)*perPage;
  const items=filtered.slice(start,start+perPage);

  items.forEach(item=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <a href="${item.link}" target="_blank">
        <img src="${item.image}" alt="${item.title}">
        <p>${item.title}<br>Creator: ${item.creator}</p>
      </a>
    `;
    grid.appendChild(card);
  });
}

function updateButtons(){
  const max=Math.ceil(filtered.length/perPage);
  prevBtn.disabled=currentPage===1;
  nextBtn.disabled=currentPage===max;
}

nextBtn.onclick=()=>{
  const max=Math.ceil(filtered.length/perPage);
  if(currentPage<max){currentPage++;render();updateButtons();}
};

prevBtn.onclick=()=>{
  if(currentPage>1){currentPage--;render();updateButtons();}
};

searchInput.addEventListener('input',()=>{
  const term=searchInput.value.toLowerCase();
  filtered=wallpapers.filter(w=>
    w.title.toLowerCase().includes(term) ||
    w.tags.join(' ').toLowerCase().includes(term)
  );
  currentPage=1;
  render();
  updateButtons();
});

tags.forEach(tag=>{
  tag.onclick=()=>{
    tags.forEach(t=>t.classList.remove('active'));
    tag.classList.add('active');
    const val=tag.textContent.toLowerCase();
    filtered=wallpapers.filter(w=>
      w.tags.map(t=>t.toLowerCase()).includes(val)
    );
    currentPage=1;
    render();
    updateButtons();
  };
});

});
</script>

</body>
</html>
