<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACX Walls</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050914;
  --panel:#0b1124;
  --border:#1b2442;
  --neon:#4ddcff;
  --pink:#ff2f6d;
  --text:#e9ecf3;
  --muted:#8c96ad;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:radial-gradient(circle at top,#0b1228,#050914 70%);
  color:var(--text);
  font-family:system-ui,sans-serif;
  overflow-x:hidden;
}

/* HEADER */
header{
  padding:32px 26px;
  display:flex;
  justify-content:center;
}
.logo{
  font-family:'Orbitron',sans-serif;
  color:var(--pink);
  font-size:40px;
  letter-spacing:3px;
}

/* TITLE */
.title{
  font-family:'Orbitron',sans-serif;
  font-size:24px;
  max-width:1400px;
  margin:30px auto 14px;
  padding:0 26px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
  padding:0 26px;
  max-width:1400px;
  margin:auto;
}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}

/* CARD */
.card{
  background:linear-gradient(180deg,#0b1124,#070c1c);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:0.35s;
}
.card:hover{
  transform:scale(1.03);
  box-shadow:0 0 18px rgba(77,220,255,.5);
}
.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}
.card p{
  padding:10px 12px;
  font-size:13px;
  color:#cfd6ff;
}
.card a{
  text-decoration:none;
  color:inherit;
}
</style>
</head>

<body>

<header>
  <div class="logo">ACX Walls</div>
</header>

<div class="title">Latest Uploads</div>

<!-- ✅ GRID START -->
<div class="grid">

  <!-- ✅ FIXED CARD -->
  <div class="card">
    <a href="https://www.artstation.com/artwork/qQVgy2" target="_blank">
      <img src="ginyang-chia-draw.jpg" alt="Female Sekiro Wallpaper 4K">
      <p>
        Female Sekiro Wallpaper 4K<br>
        Creator: Ginyang Chia
      </p>
    </a>
  </div>

  <!-- Dummy cards (same as before) -->
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 2</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 3</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 4</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 5</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 6</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 7</p></div>
  <div class="card"><img src="https://via.placeholder.com/1280x720"><p>Wallpaper 8</p></div>

</div>
<!-- ✅ GRID END -->

</body>
</html>
